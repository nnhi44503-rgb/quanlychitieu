/* ---------- H.7 THỬ THÁCH TIẾT KIỆM ---------- */
function challengeProgress(c){
  const start = c.start, end = c.end;
  if(c.metric === 'saved'){
    let sum = 0;
    S.goals.forEach(function(g){
      (g.contributions || []).forEach(function(k){
        if(k.date >= start && k.date <= end){
          sum += (k.type === 'withdraw' ? -Number(k.amount) : Number(k.amount));
        }
      });
    });
    return { value: Math.max(0, sum), target: Number(c.target) || 0 };
  }
  if(c.metric === 'log_days'){
    const days = {};
    S.tx.forEach(function(t){
      const d = String(t.datetime).slice(0,10);
      if(d >= start && d <= end) days[d] = true;
    });
    S.journal.forEach(function(j){
      if(j.date >= start && j.date <= end) days[j.date] = true;
    });
    return { value: Object.keys(days).length, target: Number(c.target) || 0 };
  }
  if(c.metric === 'limit'){
    let spent = 0;
    S.tx.forEach(function(t){
      const d = String(t.datetime).slice(0,10);
      if(t.type === 'expense' && d >= start && d <= end) spent += Number(t.amount);
    });
    return { value: spent, target: Number(c.target) || 0, invert: true };
  }
  if(c.metric === 'no_spend'){
    const spent = {};
    S.tx.forEach(function(t){
      const d = String(t.datetime).slice(0,10);
      if(t.type === 'expense' && d >= start && d <= end) spent[d] = true;
    });
    const totalDays = Math.max(0, diffDays(start, end) + 1);
    return { value: totalDays - Object.keys(spent).length, target: Number(c.target) || 0 };
  }
  return { value: 0, target: 1 };
}

const METRIC_LABEL = {
  saved: 'Số tiền nạp vào quỹ tiết kiệm',
  log_days: 'Số ngày có ghi chép',
  limit: 'Tổng chi tiêu (không vượt mục tiêu)',
  no_spend: 'Số ngày không chi tiêu'
};

VIEWS.challenges = function(){
  const active = S.challenges.filter(function(c){ return c.status === 'active'; });
  const paused = S.challenges.filter(function(c){ return c.status === 'paused'; });
  const done = S.challenges.filter(function(c){ return c.status === 'done'; });

  const card = function(c){
    const pr = challengeProgress(c);
    let p = pr.target ? pct(pr.value, pr.target) : 0;
    let good = pr.invert ? pr.value <= pr.target : pr.value >= pr.target;
    let cls = 'gold';
    if(pr.invert){ cls = good ? 'income' : (p >= 100 ? 'danger' : 'warn'); }
    else { cls = p >= 100 ? 'income' : (p >= 60 ? 'gold' : 'warn'); }
    const statusChip = c.status === 'active' ? '<span class="chip income">Đang diễn ra</span>'
      : c.status === 'paused' ? '<span class="chip warn">Tạm dừng</span>'
      : '<span class="chip saving">Đã kết thúc</span>';
    return '<div class="card challenge-card ' + c.status + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">' +
        '<div><div class="goal-name">' + esc(c.name) + '</div>' +
          '<div class="goal-meta">' + dateVN(c.start) + ' → ' + dateVN(c.end) + ' • ' + esc(METRIC_LABEL[c.metric] || '') + '</div></div>' +
        statusChip +
      '</div>' +
      '<div class="goal-nums"><span>Tiến độ</span><b>' +
        (c.metric === 'saved' || c.metric === 'limit' ? fmt(pr.value) + ' / ' + fmt(pr.target) : pr.value + ' / ' + pr.target) +
      '</b></div>' +
      '<div class="progress ' + cls + '"><i style="width:' + clamp(p,0,100) + '%"></i></div>' +
      '<div class="progress-row" style="margin-top:6px"><span>' + p + '% hoàn thành</span><span>' +
        (c.status === 'done' ? (good ? '✓ Đạt mục tiêu' : '✗ Chưa đạt mục tiêu') : 'Còn ' + Math.max(0, diffDays(todayISO(), c.end)) + ' ngày') +
      '</span></div>' +
      (c.note ? '<p style="font-size:12px;color:var(--muted);margin-top:8px">' + esc(c.note) + '</p>' : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px" class="no-print">' +
        (c.status !== 'done' ? '<button class="btn btn-ghost btn-sm" data-action="challenge-toggle" data-id="' + c.id + '">' +
          (c.status === 'active' ? icon('clock', 13) + ' Tạm dừng' : icon('check', 13) + ' Tiếp tục') + '</button>' : '') +
        (c.status !== 'done' ? '<button class="btn btn-ghost btn-sm" data-action="challenge-finish" data-id="' + c.id + '">' + icon('trophy', 13) + ' Kết thúc</button>' : '') +
        '<button class="mini-btn" data-action="challenge-edit" data-id="' + c.id + '" title="Sửa">' + icon('edit', 15) + '</button>' +
        '<button class="mini-btn del" data-action="challenge-del" data-id="' + c.id + '" title="Xóa">' + icon('trash', 15) + '</button>' +
      '</div>' +
    '</div>';
  };

  const templates = CHALLENGE_TEMPLATES.map(function(t, i){
    return '<button class="btn btn-ghost btn-sm" data-action="challenge-from-template" data-idx="' + i + '">' + icon('sparkle', 13) + ' ' + esc(t.name) + '</button>';
  }).join('');

  return '<div class="page">' +
    '<div class="grid stats-grid">' +
      statCard('Đang diễn ra', String(active.length), 'Thử thách đang hoạt động', 'trophy', 'income') +
      statCard('Tạm dừng', String(paused.length), 'Thử thách đang chờ', 'clock', 'budget') +
      statCard('Đã kết thúc', String(done.length), 'Thử thách đã hoàn thành', 'check', 'saving') +
      statCard('Tổng cộng', String(S.challenges.length), 'Tất cả thử thách', 'star', 'gold') +
    '</div>' +
    '<div class="card" style="margin-top:18px">' +
      '<h3>' + icon('sparkle', 16) + ' Mẫu thử thách gợi ý</h3>' +
      '<p class="card-sub">Chọn một mẫu để bắt đầu nhanh, hoặc tự tạo thử thách riêng.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + templates +
        '<button class="btn btn-primary btn-sm" data-action="challenge-add">' + icon('plus', 13) + ' Tự tạo thử thách</button>' +
      '</div>' +
    '</div>' +
    (S.challenges.length
      ? '<div class="grid two" style="margin-top:18px">' + S.challenges.map(card).join('') + '</div>'
      : '<div class="card" style="margin-top:18px"><div class="empty">' +

/* ---------- H.8 NHẬT KÝ TÀI CHÍNH ---------- */
VIEWS.journal = function(){
  let list = S.journal.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  if(UI.jSearch){
    const q = UI.jSearch.toLowerCase();
    list = list.filter(function(j){
      return ['spentOn','reason','feeling','saved','improve'].some(function(k){
        return String(j[k] || '').toLowerCase().indexOf(q) >= 0;
      });
    });
  }
  if(UI.jMonth !== 'all') list = list.filter(function(j){ return monthOf(j.date) === UI.jMonth; });

  const monthOpts = ['all'].concat(CAL_MONTHS).map(function(m){
    return '<option value="' + m + '"' + (UI.jMonth === m ? ' selected' : '') + '>' + (m === 'all' ? 'Tất cả các tháng' : monthLabel(m)) + '</option>';
  }).join('');

  const toolbar =
    '<div class="toolbar no-print">' +
      '<div class="grow"><input class="input" type="search" id="jSearch" placeholder="Tìm trong nhật ký…" value="' + esc(UI.jSearch) + '"></div>' +
      '<select class="input" id="jMonth">' + monthOpts + '</select>' +
      '<button class="btn btn-primary btn-sm" data-action="journal-add">' + icon('plus', 14) + ' Viết nhật ký</button>' +
    '</div>';

  const entries = list.length
    ? list.map(function(j){
        return '<div class="journal-entry">' +
          '<div class="je-head">' +
            '<div class="je-date">' + weekdayVN(j.date) + ', ' + dateVN(j.date) + '</div>' +
            '<div class="row-actions no-print">' +
              '<button class="mini-btn" data-action="journal-edit" data-id="' + j.id + '" title="Sửa">' + icon('edit', 15) + '</button>' +
              '<button class="mini-btn del" data-action="journal-del" data-id="' + j.id + '" title="Xóa">' + icon('trash', 15) + '</button>' +
            '</div>' +
          '</div>' +
          (j.spentOn ? '<div class="je-q"><b>Hôm nay đã tiêu tiền vào việc gì?</b><span>' + esc(j.spentOn) + '</span></div>' : '') +
          (j.reason ? '<div class="je-q"><b>Vì sao cần khoản chi này?</b><span>' + esc(j.reason) + '</span></div>' : '') +
          (j.necessary ? '<div class="je-q"><b>Khoản chi có thực sự cần thiết không?</b><span>' + esc(j.necessary) + '</span></div>' : '') +
          (j.feeling ? '<div class="je-q"><b>Cảm nhận sau khi mua</b><span>' + esc(j.feeling) + '</span></div>' : '') +
          (j.saved ? '<div class="je-q"><b>Hôm nay đã tiết kiệm được gì?</b><span>' + esc(j.saved) + '</span></div>' : '') +
          (j.improve ? '<div class="je-q"><b>Điều cần cải thiện ngày mai</b><span>' + esc(j.improve) + '</span></div>' : '') +
        '</div>';
      }).join('')
    : '<div class="card"><div class="empty">' +
        '<div class="empty-ic">' + icon('book', 26) + '</div>' +
        '<h4>' + (S.journal.length ? 'Không tìm thấy nhật ký phù hợp' : 'Chưa có trang nhật ký nào') + '</h4>' +
        '<p>' + (S.journal.length ? 'Hãy thử từ khóa hoặc tháng khác.' : 'Ghi lại cảm nhận của bạn sau mỗi khoản chi để hiểu rõ thói quen tiêu tiền.') + '</p>' +
        '<button class="btn btn-primary" data-action="journal-add">' + icon('plus', 15) + ' Viết nhật ký đầu tiên</button>' +
      '</div></div>';

  return '<div class="page">' + toolbar + entries + '</div>';
};

/* ---------- H.9 TỔNG KẾT 7 THÁNG ---------- */
VIEWS.summary = function(){
  const all = S.tx;
  const inc = txIncome(all);
  const exp = txExpense(all);
  const sav = totalSavings();
  const assets = totalAssets();

  /* Theo tháng */
  const mInc = {}, mExp = {}, mSav = {};
  CAL_MONTHS.forEach(function(m){
    mInc[m] = txIncome(monthTx(m));
    mExp[m] = txExpense(monthTx(m));
    mSav[m] = 0;
  });
  S.goals.forEach(function(g){
    (g.contributions || []).forEach(function(c){
      const mk = monthOf(c.date);
      if(mSav[mk] !== undefined) mSav[mk] += (c.type === 'withdraw' ? -Number(c.amount) : Number(c.amount));
    });
  });

  let maxExpMonth = CAL_MONTHS[0], maxExpVal = -1;
  let bestSavMonth = CAL_MONTHS[0], bestSavVal = -Infinity;
  CAL_MONTHS.forEach(function(m){
    if(mExp[m] > maxExpVal){ maxExpVal = mExp[m]; maxExpMonth = m; }
    if(mSav[m] > bestSavVal){ bestSavVal = mSav[m]; bestSavMonth = m; }
  });

  const catMap = {};
  all.forEach(function(t){
    if(t.type !== 'expense') return;
    catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount);
  });
  const catKeys = Object.keys(catMap).sort(function(a,b){ return catMap[b] - catMap[a]; });
  const topCat = catKeys[0] || null;

  const goalDone = S.goals.filter(function(g){ return g.target > 0 && goalSaved(g) >= g.target; }).length;
  const goalRate = S.goals.length ? Math.round((goalDone / S.goals.length) * 100) : 0;
  const savingRate = inc ? Math.round((sav / inc) * 1000) / 10 : 0;

  const hasData = all.length > 0;

  /* Nhận xét tự động — chỉ khi có dữ liệu */
  const insights = [];
  if(hasData){
    if(savingRate >= 20) insights.push({ cls:'good', text:'Bạn đã tiết kiệm được ' + savingRate + '% tổng thu nhập — một tỷ lệ rất đáng khích lệ.' });
    else if(savingRate > 0) insights.push({ cls:'warn', text:'Tỷ lệ tiết kiệm hiện tại là ' + savingRate + '%. Hãy cố gắng nâng lên trên 20% trong thời gian tới.' });
    else insights.push({ cls:'bad', text:'Bạn chưa tích lũy được khoản tiết kiệm nào. Hãy thử nạp một khoản nhỏ vào quỹ tiết kiệm mỗi tuần.' });

    if(maxExpVal > 0) insights.push({ cls:'', text:'Tháng chi tiêu nhiều nhất là ' + monthLabel(maxExpMonth) + ' với ' + fmt(maxExpVal) + '.' });
    if(bestSavVal > 0) insights.push({ cls:'good', text:'Tháng tiết kiệm tốt nhất là ' + monthLabel(bestSavMonth) + ' với ' + fmt(bestSavVal) + '.' });
    if(topCat) insights.push({ cls:'', text:'Danh mục chi tiêu lớn nhất là “' + topCat + '” với ' + fmt(catMap[topCat]) + ', chiếm ' + pct(catMap[topCat], exp) + '% tổng chi.' });
    if(exp > inc) insights.push({ cls:'bad', text:'Tổng chi đang vượt tổng thu ' + fmt(exp - inc) + '. Hãy xem lại các khoản chi không cần thiết.' });
    else if(inc > 0) insights.push({ cls:'good', text:'Tổng thu vượt tổng chi ' + fmt(inc - exp) + ' — bạn đang giữ cân bằng tài chính tốt.' });
  }

  const hero =
    '<div class="summary-hero">' +
      '<h2>' + icon('star', 22) + ' Tổng kết 7 tháng tài chính</h2>' +
      '<p>Hành trình quản lý tài chính cá nhân từ 07/11/2026 đến 31/05/2027 của ' + esc(S.settings.userName || 'bạn') + '.</p>' +
      '<div class="hero-stats">' +
        '<div class="hs"><div class="l">Tổng thu nhập</div><div class="v">' + fmt(inc) + '</div></div>' +
        '<div class="hs"><div class="l">Tổng chi tiêu</div><div class="v">' + fmt(exp) + '</div></div>' +
        '<div class="hs"><div class="l">Tổng tiết kiệm</div><div class="v">' + fmt(sav) + '</div></div>' +
        '<div class="hs"><div class="l">Tài sản cuối kỳ</div><div class="v gold">' + fmt(assets) + '</div></div>' +
      '</div>' +
    '</div>';

  const actions =
    '<div class="toolbar no-print">' +
      '<button class="btn btn-primary btn-sm" data-action="summary-print">' + icon('print', 14) + ' In / Lưu PDF</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="summary-csv">' + icon('download', 14) + ' Xuất bảng dữ liệu CSV</button>' +
      '<span class="chip" style="margin-left:auto">' + icon('info', 12) + ' Kỳ báo cáo: 07/11/2026 – 31/05/2027</span>' +
    '</div>';

  const stats =
    '<div class="grid stats-grid">' +
      statCard('Tháng chi nhiều nhất', (maxExpVal > 0 ? monthLabel(maxExpMonth) : '—'), (maxExpVal > 0 ? fmt(maxExpVal) : 'Chưa có dữ liệu'), 'arrowUp', 'expense') +
      statCard('Tháng tiết kiệm tốt nhất', (bestSavVal > 0 ? monthLabel(bestSavMonth) : '—'), (bestSavVal > 0 ? fmt(bestSavVal) : 'Chưa có dữ liệu'), 'target', 'saving') +
      statCard('Danh mục chi nhiều nhất', (topCat || '—'), (topCat ? fmt(catMap[topCat]) : 'Chưa có dữ liệu'), 'wallet', 'budget') +
      statCard('Tỷ lệ tiết kiệm', savingRate + '%', 'Tiết kiệm trên thu nhập', 'chart', 'gold') +
      statCard('Mục tiêu hoàn thành', goalDone + ' / ' + S.goals.length, goalRate + '% mục tiêu đã đạt', 'trophy', 'income') +
      statCard('Số giao dịch', String(all.length), 'Trong toàn kỳ', 'swap', '') +
    '</div>';

  if(hasData){
    queueChart('chartSummary', {
      type: 'line',
      data: {
        labels: CAL_MONTHS.map(function(m){ return 'T' + Number(m.slice(5,7)); }),
        datasets: [
          { label:'Thu nhập', data: CAL_MONTHS.map(function(m){ return mInc[m]; }), borderColor:'#8FCFA8', backgroundColor:'rgba(143,207,168,.18)', fill:true, tension:.35, pointRadius:3.5, borderWidth:2.4 },
          { label:'Chi tiêu', data: CAL_MONTHS.map(function(m){ return mExp[m]; }), borderColor:'#F0AEBD', backgroundColor:'rgba(240,174,189,.2)', fill:true, tension:.35, pointRadius:3.5, borderWidth:2.4 },
          { label:'Tiết kiệm', data: CAL_MONTHS.map(function(m){ return mSav[m]; }), borderColor:'#9EC9E8', backgroundColor:'rgba(158,201,232,.16)', fill:true, tension:.35, pointRadius:3.5, borderWidth:2.4 }
        ]
      },
      options:{
        plugins:{ legend:{ position:'top', align:'end' } },
        scales:{
          x:{ grid:{ display:false }, ticks:{ color:TICK_COLOR, font:{ size:11 } } },
          y:{ beginAtZero:true, grid:{ color:GRID_COLOR, drawBorder:false }, ticks:{ color:TICK_COLOR, font:{ size:10 }, callback:function(v){ return fmtNum(v); } } }
        }
      }
    });
  }

  const monthTable =
    '<div class="card"><h3>' + icon('calendar', 16) + ' Biến động tài chính qua 7 tháng</h3>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr>' +
        '<th>Tháng</th><th style="text-align:right">Thu nhập</th><th style="text-align:right">Chi tiêu</th>' +
        '<th style="text-align:right">Tiết kiệm</th><th style="text-align:right">Chênh lệch</th>' +
      '</tr></thead><tbody>' +
      CAL_MONTHS.map(function(m){
        const diff = mInc[m] - mExp[m];
        return '<tr><td><b>' + monthLabel(m) + '</b></td>' +
          '<td class="num amount-in">' + fmt(mInc[m]) + '</td>' +
          '<td class="num amount-out">' + fmt(mExp[m]) + '</td>' +
          '<td class="num">' + fmt(mSav[m]) + '</td>' +
          '<td class="num ' + (diff >= 0 ? 'amount-in' : 'amount-out') + '">' + (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff)) + '</td></tr>';
      }).join('') +
      '<tr style="background:var(--ice-blue)"><td><b>TỔNG</b></td>' +
        '<td class="num amount-in"><b>' + fmt(inc) + '</b></td>' +
        '<td class="num amount-out"><b>' + fmt(exp) + '</b></td>' +
        '<td class="num"><b>' + fmt(sav) + '</b></td>' +
        '<td class="num ' + (inc-exp >= 0 ? 'amount-in' : 'amount-out') + '"><b>' + (inc-exp >= 0 ? '+' : '−') + fmt(Math.abs(inc-exp)) + '</b></td></tr>' +
      '</tbody></table></div>' +
    '</div>';

  const insightBlock =
    '<div class="card" style="margin-top:18px">' +
      '<h3>' + icon('sparkle', 16) + ' Nhận xét tự động</h3>' +
      (insights.length
        ? insights.map(function(i){ return '<div class="insight ' + i.cls + '">' + icon('sparkle', 15) + '<div>' + esc(i.text) + '</div></div>'; }).join('')
        : '<div class="empty" style="padding:26px 10px"><div class="empty-ic">' + icon('info', 24) + '</div>' +
          '<h4>Chưa đủ dữ liệu để nhận xét</h4><p>Hãy ghi chép giao dịch để hệ thống đưa ra nhận xét chính xác.</p></div>') +
    '</div>';

  return '<div class="page">' + hero + actions + stats +
    '<div class="card" style="margin-top:18px"><h3>' + icon('chart', 16) + ' Biểu đồ biến động tài chính</h3>' +
      (hasData ? '<div class="chart-box tall"><canvas id="chartSummary"></canvas></div>' : emptyChart('Chưa có giao dịch nào trong toàn kỳ')) +
    '</div>' + monthTable + insightBlock +
  '</div>';
};

/* ----- I.1 Giao dịch ----- */
function openTxModal(id, presetDate){
  const tx = id ? S.tx.find(function(t){ return t.id === id; }) : null;
  const isEdit = !!tx;
  let type = tx ? tx.type : 'expense';
  const stamp = tx ? tx.datetime : (presetDate || todayISO()) + 'T' + pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());

  const body =
    '<form id="txForm" autocomplete="off">' +
      '<div class="field">' +
        '<label>Loại giao dịch <span class="req">*</span></label>' +
        '<div class="segmented" id="txTypeSeg">' +
          '<button type="button" data-type="income" class="' + (type === 'income' ? 'active' : '') + '">Thu nhập</button>' +
          '<button type="button" data-type="expense" class="' + (type === 'expense' ? 'active' : '') + '">Chi tiêu</button>' +
        '</div>' +
      '</div>' +
      '<div class="form-grid">' +
        '<div class="field span2"><label for="fName">Tên giao dịch <span class="req">*</span></label>' +
          '<input class="input" id="fName" value="' + esc(tx ? tx.name : '') + '" placeholder="Ví dụ: Ăn sáng, Tiền tiêu vặt tháng 11…" required></div>' +
        '<div class="field"><label for="fAmount">Số tiền (₫) <span class="req">*</span></label>' +
          '<input class="input" id="fAmount" type="number" min="1" step="1000" value="' + (tx ? Number(tx.amount) : '') + '" placeholder="0" required></div>' +
        '<div class="field"><label for="fCat">Danh mục <span class="req">*</span></label>' +
          '<select class="input" id="fCat"></select></div>' +
        '<div class="field"><label for="fDate">Ngày <span class="req">*</span></label>' +
          '<input class="input" id="fDate" type="date" value="' + esc(String(stamp).slice(0,10)) + '" required></div>' +
        '<div class="field"><label for="fTime">Giờ</label>' +
          '<input class="input" id="fTime" type="time" value="' + esc(String(stamp).slice(11,16) || '09:00') + '"></div>' +
        '<div class="field span2"><label for="fMethod">Phương thức thanh toán</label>' +
          '<select class="input" id="fMethod">' +
            PAYMENT_METHODS.map(function(m){
              return '<option value="' + esc(m) + '"' + ((tx && tx.method === m) ? ' selected' : '') + '>' + esc(m) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="field span2"><label for="fNote">Ghi chú</label>' +
          '<textarea class="input" id="fNote" placeholder="Ghi chú thêm về giao dịch…">' + esc(tx ? (tx.note || '') : '') + '</textarea></div>' +
      '</div>' +
    '</form>';

  openModal({
    title: isEdit ? 'Chỉnh sửa giao dịch' : 'Thêm giao dịch mới',
    body: body,
    footer: '<button class="btn btn-ghost" data-action="modal-close">Hủy</button>' +
            '<button class="btn btn-primary" id="txSave">' + icon('check', 15) + ' ' + (isEdit ? 'Lưu thay đổi' : 'Thêm giao dịch') + '</button>',
    onMount: function(root){
      const catSel = root.querySelector('#fCat');
      function fillCats(t){
        const cats = t === 'income' ? S.settings.categories.income : S.settings.categories.expense;
        const cur = tx ? tx.category : '';
        catSel.innerHTML = cats.map(function(c){
          return '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('');
      }
      fillCats(type);

      root.querySelectorAll('#txTypeSeg button').forEach(function(btn){
        btn.addEventListener('click', function(){
          type = btn.dataset.type;
          root.querySelectorAll('#txTypeSeg button').forEach(function(b){ b.classList.toggle('active', b === btn); });
          fillCats(type);
        });
      });

      root.querySelector('#txSave').addEventListener('click', function(){
        const name = root.querySelector('#fName').value.trim();
        const amount = Number(root.querySelector('#fAmount').value);
        const cat = catSel.value;
        const date = root.querySelector('#fDate').value;
        const time = root.querySelector('#fTime').value || '00:00';
        const method = root.querySelector('#fMethod').value;
        const note = root.querySelector('#fNote').value.trim();

        if(!name){ toast('Vui lòng nhập tên giao dịch.', 'error'); root.querySelector('#fName').focus(); return; }
        if(!(amount > 0) || !isFinite(amount)){ toast('Số tiền phải là số dương.', 'error'); root.querySelector('#fAmount').focus(); return; }
        if(!cat){ toast('Vui lòng chọn danh mục.', 'error'); return; }
        if(!date){ toast('Vui lòng chọn ngày giao dịch.', 'error'); return; }

        const stamp = date + 'T' + time;
        const inRange = date >= RANGE.start && date <= RANGE.end;

        const doSave = function(){
          if(isEdit){
            tx.name = name;
            tx.amount = amount;
            tx.type = type;
            tx.category = cat;
            tx.datetime = stamp;
            tx.method = method;
            tx.note = note;
          } else {
            S.tx.push({
              id: uid(), name: name, amount: amount, type: type, category: cat,
              datetime: stamp, method: method, note: note, created: nowStamp()
            });
          }
          save(true);
          closeModal();
          render();
          toast(isEdit ? 'Đã cập nhật giao dịch.' : 'Đã thêm giao dịch mới.', 'success');
        };

        if(!inRange){
          confirmAction('Ngày ' + dateVN(date) + ' nằm ngoài kỳ quản lý (07/11/2026 – 31/05/2027). Bạn vẫn muốn lưu giao dịch này?', doSave);
        } else {
          doSave();
        }
      });
    }
  });
}

function openGoalTransfer(goalId, mode){
  const g = S.goals.find(function(x){ return x.id === goalId; });
  if(!g) return;
  const saved = Math.max(0, goalSaved(g));
  const avail = availableCash();
  const isDeposit = mode === 'deposit';
  const maxVal = isDeposit ? avail : saved;

  const body =
    '<form id="transferForm" autocomplete="off">' +
      '<div class="insight">' + icon('info', 15) + '<div>' +
        (isDeposit
          ? 'Tiền khả dụng hiện tại: <b>' + fmt(avail) + '</b>. Nạp tiền vào quỹ là chuyển nội bộ, không phải khoản chi tiêu.'
          : 'Số tiền đang có trong quỹ “' + esc(g.name) + '”: <b>' + fmt(saved) + '</b>. Rút tiền sẽ đưa tiền trở lại tiền khả dụng.') +
      '</div></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label for="tAmount">Số tiền (₫) <span class="req">*</span></label>' +
          '<input class="input" id="tAmount" type="number" min="1" step="1000" max="' + maxVal + '" required></div>' +
        '<div class="field"><label for="tDate">Ngày <span class="req">*</span></label>' +
          '<input class="input" id="tDate" type="date" value="' + todayISO() + '" required></div>' +
        '<div class="field span2"><label for="tNote">Ghi chú</label>' +
          '<input class="input" id="tNote" placeholder="Ví dụ: Tiết kiệm từ tiền tiêu vặt tháng 11…"></div>' +
      '</div>' +
    '</form>';

  openModal({
    title: (isDeposit ? 'Nạp tiền vào quỹ – ' : 'Rút tiền từ quỹ – ') + g.name,
    body: body,
    footer: '<button class="btn btn-ghost" data-action="modal-close">Hủy</button>' +
            '<button class="btn btn-primary" id="transferSave">' + icon('check', 15) + ' Xác nhận</button>',
    onMount: function(root){
      root.querySelector('#transferSave').addEventListener('click', function(){
        const amount = Number(root.querySelector('#tAmount').value);
        const date = root.querySelector('#tDate').value;
        const note = root.querySelector('#tNote').value.trim();
        if(!(amount > 0)){ toast('Số tiền phải lớn hơn 0.', 'error'); return; }
        if(!date){ toast('Vui lòng chọn ngày.', 'error'); return; }
        if(isDeposit && amount > avail){ toast('Số tiền vượt quá tiền khả dụng (' + fmt(avail) + ').', 'error'); return; }
        if(!isDeposit && amount > saved){ toast('Số tiền vượt quá số dư trong quỹ (' + fmt(saved) + ').', 'error'); return; }

        if(!g.contributions) g.contributions = [];
        g.contributions.push({
          id: uid(), date: date, amount: amount,
          type: isDeposit ? 'deposit' : 'withdraw',
          note: note, created: nowStamp()
        });
        save(true);
        closeModal();
        render();
        toast(isDeposit ? 'Đã nạp ' + fmt(amount) + ' vào quỹ.' : 'Đã rút ' + fmt(amount) + ' khỏi quỹ.', 'success');
      });
    }
  });
}

        const start = root.querySelector('#cStart').value;
        const end = root.querySelector('#cEnd').value;
        const note = root.querySelector('#cNote').value.trim();

        if(!start || !end){ toast('Vui lòng chọn ngày bắt đầu và kết thúc.', 'error'); return; }
        if(end < start){ toast('Ngày kết thúc phải sau ngày bắt đầu.', 'error'); return; }

        if(c){
          c.name = name; c.metric = metric; c.target = target;
          c.start = start; c.end = end; c.note = note;
        } else {
          S.challenges.push({
            id: uid(), name: name, metric: metric, target: target,
            start: start, end: end, note: note, status: 'active', created: nowStamp()
          });
        }
        save(true);
        closeModal();
        render();
        toast(c ? 'Đã cập nhật thử thách.' : 'Đã tạo thử thách mới. Chúc bạn thành công!', 'success');
      });
    }
  });
}

   J. XUẤT / NHẬP DỮ LIỆU
   ============================================================ */
function download(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function toCSV(rows){
  return '\uFEFF' + rows.map(function(r){
    return r.map(function(c){
      return '"' + String(c === null || c === undefined ? '' : c).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\r\n');
}
function exportJSON(){
  const payload = JSON.stringify(S, null, 2);
  download('my-finance-journal-backup-' + todayISO() + '.json', payload, 'application/json;charset=utf-8');
  toast('Đã xuất file sao lưu JSON.', 'success');
}
function exportTransactionsCSV(){
  const rows = [['Mã','Tên giao dịch','Loại','Danh mục','Ngày','Giờ','Phương thức','Số tiền (VND)','Ghi chú']];
  S.tx.slice().sort(function(a,b){ return String(a.datetime).localeCompare(String(b.datetime)); })
    .forEach(function(t){
      rows.push([
        String(t.id).slice(-6).toUpperCase(),
        t.name,
        t.type === 'income' ? 'Thu nhập' : 'Chi tiêu',
        t.category,
        String(t.datetime).slice(0,10),
        String(t.datetime).slice(11,16),
        t.method || '',
        Number(t.amount),
        t.note || ''
      ]);
    });
  download('giao-dich-' + todayISO() + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
  toast('Đã xuất file CSV giao dịch.', 'success');
}
function exportSummaryCSV(){
  const rows = [['Tháng','Thu nhập (VND)','Chi tiêu (VND)','Tiết kiệm (VND)','Chênh lệch (VND)']];
  CAL_MONTHS.forEach(function(m){
    const inc = txIncome(monthTx(m));
    const exp = txExpense(monthTx(m));
    let sav = 0;
    S.goals.forEach(function(g){
      (g.contributions || []).forEach(function(c){
        if(monthOf(c.date) === m) sav += (c.type === 'withdraw' ? -Number(c.amount) : Number(c.amount));
      });
    });
    rows.push([monthLabel(m), inc, exp, sav, inc - exp]);
  });
  const totalInc = txIncome(S.tx), totalExp = txExpense(S.tx);
  rows.push(['TỔNG', totalInc, totalExp, totalSavings(), totalInc - totalExp]);
  download('tong-ket-7-thang-' + todayISO() + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
  toast('Đã xuất bảng tổng kết CSV.', 'success');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = function(e){
    let obj;
    try { obj = JSON.parse(String(e.target.result)); }
    catch(err){ toast('File JSON không hợp lệ. Dữ liệu hiện tại được giữ nguyên.', 'error'); return; }
    if(!obj || typeof obj !== 'object' || !Array.isArray(obj.tx)){
      toast('Cấu trúc file không đúng. Dữ liệu hiện tại được giữ nguyên.', 'error'); return;
    }
    confirmAction('Nhập file sao lưu sẽ thay thế toàn bộ dữ liệu hiện tại. Bạn có chắc chắn?', function(){
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(obj));
        S = loadState();
        save(true);
        render();
        toast('Đã khôi phục dữ liệu từ file sao lưu.', 'success');
      } catch(err){
        toast('Khôi phục thất bại. Dữ liệu cũ vẫn được giữ nguyên.', 'error');
      }
    }, true);
  };
  reader.onerror = function(){ toast('Không đọc được file.', 'error'); };
  reader.readAsText(file);
}

/* ============================================================
   K. XỬ LÝ SỰ KIỆN
   ============================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){

    /* ---------- Điều hướng & layout ---------- */
    case 'nav':
      navigate(el.dataset.view);
      break;

    case 'toggle-sidebar': {
      const app = document.getElementById('app');
      if(window.innerWidth <= 980){
        app.classList.toggle('nav-open');
        if(app.classList.contains('nav-open')){
          const bd = document.createElement('div');
          bd.className = 'nav-backdrop';
          bd.addEventListener('click', function(){ app.classList.remove('nav-open'); bd.remove(); });
          document.body.appendChild(bd);
        } else {
          const bd = document.querySelector('.nav-backdrop');
          if(bd) bd.remove();
        }
      } else {
        app.classList.toggle('collapsed');
      }
      break;
    }

    case 'quick-add':
      openTxModal(null, null);
      break;

    case 'modal-close':
      closeModal();
      break;

    /* ---------- Thông báo ---------- */
    case 'toggle-notif':
      toggleNotifPanel();
      break;
    case 'notif-mark-all':
      S.readNotifs = buildNotifications().map(function(n){ return n.id; });
      save(true);
      renderNotifPanel();
      updateNotifBadge();
      toast('Đã đánh dấu tất cả thông báo là đã đọc.', 'success');
      break;
    case 'notif-clear':
      S.readNotifs = [];
      save(true);
      renderNotifPanel();
      updateNotifBadge();
      toast('Đã đặt lại trạng thái thông báo.', 'success');
      break;

    /* ---------- Dashboard ---------- */
    case 'dash-prev': {
      const i = CAL_MONTHS.indexOf(UI.dashMonth);
      if(i > 0){ UI.dashMonth = CAL_MONTHS[i-1]; render(); }
      break;
    }
    case 'dash-next': {
      const i = CAL_MONTHS.indexOf(UI.dashMonth);
      if(i < CAL_MONTHS.length - 1){ UI.dashMonth = CAL_MONTHS[i+1]; render(); }
      break;
    }

    /* ---------- Giao dịch ---------- */
    case 'tx-view': openTxDetail(id); break;
    case 'tx-edit': closeModal(); openTxModal(id); break;
    case 'tx-del': {
      const t = S.tx.find(function(x){ return x.id === id; });
      if(!t) break;
      confirmAction('Xóa giao dịch “' + t.name + '” (' + fmt(t.amount) + ')? Số dư và báo cáo sẽ được tính lại.', function(){
        S.tx = S.tx.filter(function(x){ return x.id !== id; });
        save(true);
        render();
        toast('Đã xóa giao dịch.', 'success');
      }, true);
      break;
    }
    case 'tx-reset-filter':
      UI.txSearch = ''; UI.txType = 'all'; UI.txCat = 'all';
      UI.txFrom = ''; UI.txTo = ''; UI.txSort = 'date-desc';
      render();
      break;

    /* ---------- Ngân sách ---------- */
    case 'budget-edit': openBudgetModal(id); break;

    /* ---------- Tiết kiệm ---------- */
    case 'goal-add': openGoalModal(null); break;
    case 'goal-edit': openGoalModal(id); break;
    case 'goal-del': {
      const g = S.goals.find(function(x){ return x.id === id; });
      if(!g) break;
      confirmAction('Xóa mục tiêu “' + g.name + '”? Số tiền ' + fmt(Math.max(0, goalSaved(g))) + ' trong quỹ sẽ trở lại tiền khả dụng.', function(){
        S.goals = S.goals.filter(function(x){ return x.id !== id; });
        save(true);
        render();
        toast('Đã xóa mục tiêu tiết kiệm.', 'success');
      }, true);
      break;
    }
    case 'goal-deposit': openGoalTransfer(id, 'deposit'); break;
    case 'goal-withdraw': openGoalTransfer(id, 'withdraw'); break;
    case 'goal-history': openGoalHistory(id); break;

    /* ---------- Lịch ---------- */
    case 'cal-prev': {
      const i = CAL_MONTHS.indexOf(UI.calMonth);
      if(i > 0){ UI.calMonth = CAL_MONTHS[i-1]; render(); }
      break;
    }
    case 'cal-next': {
      const i = CAL_MONTHS.indexOf(UI.calMonth);
      if(i < CAL_MONTHS.length - 1){ UI.calMonth = CAL_MONTHS[i+1]; render(); }
      break;
    }
    case 'cal-day':
      UI.calDay = id;
      render();
      break;
    case 'cal-add':
      openTxModal(null, id);
      break;

    /* ---------- Báo cáo ---------- */
    case 'report-csv': exportTransactionsCSV(); break;

    /* ---------- Thử thách ---------- */
    case 'challenge-add': openChallengeModal(null, null); break;
    case 'challenge-from-template':
      openChallengeModal(null, Number(el.dataset.idx));
      break;
    case 'challenge-edit': openChallengeModal(id, null); break;
    case 'challenge-del': {
      const c = S.challenges.find(function(x){ return x.id === id; });
      if(!c) break;
      confirmAction('Xóa thử thách “' + c.name + '”?', function(){
        S.challenges = S.challenges.filter(function(x){ return x.id !== id; });
        save(true);
        render();
        toast('Đã xóa thử thách.', 'success');
      }, true);
      break;
    }
    case 'challenge-toggle': {
      const c = S.challenges.find(function(x){ return x.id === id; });
      if(!c) break;
      c.status = c.status === 'active' ? 'paused' : 'active';
      save(true);
      render();
      toast(c.status === 'active' ? 'Đã tiếp tục thử thách.' : 'Đã tạm dừng thử thách.', 'success');
      break;
    }
    case 'challenge-finish': {
      const c = S.challenges.find(function(x){ return x.id === id; });
      if(!c) break;
      confirmAction('Kết thúc thử thách “' + c.name + '”? Tiến độ hiện tại sẽ được ghi nhận.', function(){
        c.status = 'done';
        save(true);
        render();
        toast('Đã kết thúc thử thách.', 'success');
      });
      break;
    }

    /* ---------- Nhật ký ---------- */
    case 'journal-add': openJournalModal(null, null); break;
    case 'journal-edit': openJournalModal(id, null); break;
    case 'journal-del': {
      const j = S.journal.find(function(x){ return x.id === id; });
      if(!j) break;
      confirmAction('Xóa trang nhật ký ngày ' + dateVN(j.date) + '?', function(){
        S.journal = S.journal.filter(function(x){ return x.id !== id; });
        save(true);
        render();
        toast('Đã xóa trang nhật ký.', 'success');
      }, true);
      break;
    }

    /* ---------- Tổng kết ---------- */
    case 'summary-print': window.print(); break;
    case 'summary-csv': exportSummaryCSV(); break;

    /* ---------- Cài đặt ---------- */
    case 'settings-save': {
      const name = document.getElementById('setName').value.trim();
      const initial = Number(document.getElementById('setInitial').value) || 0;
      const bm = Number(document.getElementById('setBudgetMonthly').value) || 0;
      const bd = Number(document.getElementById('setBudgetDaily').value) || 0;
      const theme = document.getElementById('setTheme').value;
      if(initial < 0){ toast('Số dư ban đầu không được âm.', 'error'); return; }
      S.settings.userName = name;
      S.settings.initialBalance = initial;
      S.settings.defaultBudget.monthly = Math.max(0, bm);
      S.settings.defaultBudget.daily = Math.max(0, bd);
      S.settings.theme = theme;
      S.settings.currency = 'VND';
      save(true);
      document.body.classList.toggle('dark', theme === 'dark');
      render();
      toast('Đã lưu cài đặt.', 'success');
      break;
    }
    case 'cat-add': {
      const type = el.dataset.type;
      const inp = document.getElementById('newCat_' + type);
      const val = inp ? inp.value.trim() : '';
      if(!val){ toast('Vui lòng nhập tên danh mục.', 'error'); break; }
      if(S.settings.categories[type].indexOf(val) >= 0){ toast('Danh mục này đã tồn tại.', 'error'); break; }
      S.settings.categories[type].push(val);
      save(true);
      render();
      toast('Đã thêm danh mục “' + val + '”.', 'success');
      break;
    }
    case 'cat-del': {
      const type = el.dataset.type;
      const name = el.dataset.name;
      const used = S.tx.some(function(t){ return t.category === name; });
      if(used){
        confirmAction('Danh mục “' + name + '” đang được dùng trong giao dịch. Vẫn xóa khỏi danh sách? (Giao dịch cũ giữ nguyên danh mục.)', function(){
          S.settings.categories[type] = S.settings.categories[type].filter(function(c){ return c !== name; });
          save(true); render(); toast('Đã xóa danh mục.', 'success');
        }, true);
      } else {
        S.settings.categories[type] = S.settings.categories[type].filter(function(c){ return c !== name; });
        save(true); render(); toast('Đã xóa danh mục.', 'success');
      }
      break;
    }
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportTransactionsCSV(); break;
    case 'import-json': {
      const inp = document.getElementById('importFile');
      if(inp){ inp.value = ''; inp.click(); }
      break;
    }
    case 'clear-all':
      confirmAction('XÓA TOÀN BỘ DỮ LIỆU? Tất cả giao dịch, ngân sách, mục tiêu, thử thách và nhật ký sẽ bị xóa vĩnh viễn. Hành động này không thể hoàn tác.', function(){
        localStorage.removeItem(STORE_KEY);
        S = defaultState();
        save(true);
        render();
        toast('Đã xóa toàn bộ dữ liệu.', 'success');
      }, true);
      break;

    default: break;
  }
});

    UI.txType = t.value; render(); return;
  }
  if(t.id === 'txCat'){
    UI.txCat = t.value; render(); return;
  }
  if(t.id === 'txSort'){
    UI.txSort = t.value; render(); return;
  }
  if(t.id === 'txFrom'){
    UI.txFrom = t.value; render(); return;
  }
  if(t.id === 'txTo'){
    UI.txTo = t.value; render(); return;
  }
  if(t.dataset && t.dataset.action === 'dash-month'){
    UI.dashMonth = t.value; render(); return;
  }
  if(t.id === 'repRange'){
    UI.repRange = t.value;
    if(t.value === 'custom'){
      if(!UI.repFrom) UI.repFrom = todayISO();
      if(!UI.repTo) UI.repTo = todayISO();
    }
    render(); return;
  }
  if(t.id === 'repFrom'){ UI.repFrom = t.value; render(); return; }
  if(t.id === 'repTo'){ UI.repTo = t.value; render(); return; }
  if(t.id === 'jMonth'){ UI.jMonth = t.value; render(); return; }
  if(t.id === 'importFile'){
    if(t.files && t.files[0]) importJSON(t.files[0]);
    return;
  }
  if(t.id === 'setTheme'){
    S.settings.theme = t.value;
    document.body.classList.toggle('dark', t.value === 'dark');
    save(true);
    return;
  }
});

      UI.jSearch = t.value;
      render();
      const inp = document.getElementById('jSearch');
      if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }, 320);
    return;
  }
});

/* Phím tắt */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(document.getElementById('modalRoot').innerHTML){ closeModal(); }
    const panel = document.getElementById('notifPanel');
    if(panel) panel.remove();
    document.getElementById('app').classList.remove('nav-open');
    const bd = document.querySelector('.nav-backdrop');
    if(bd) bd.remove();
  }
  /* Ctrl/Cmd + K : thêm giao dịch nhanh */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    openTxModal(null, null);
  }
});

/* ---- Trung tâm thông báo ---- */
function toggleNotifPanel(){
  const existing = document.getElementById('notifPanel');
  if(existing){ existing.remove(); return; }
  renderNotifPanel();
}
function renderNotifPanel(){
  const old = document.getElementById('notifPanel');
  if(old) old.remove();

  const all = buildNotifications();
  const read = S.readNotifs || [];
  const panel = document.createElement('div');
  panel.className = 'notif-panel';
  panel.id = 'notifPanel';

  const items = all.length
    ? all.map(function(n){
        const isRead = read.indexOf(n.id) >= 0;
        return '<div class="notif-item ' + (isRead ? '' : 'unread') + '">' +
          '<div class="ni-dot"></div>' +
          '<div><div class="ni-title">' + esc(n.title) + '</div>' +
          '<div class="ni-text">' + esc(n.text) + '</div></div>' +
        '</div>';
      }).join('')
    : '<div class="empty" style="padding:30px 12px"><div class="empty-ic">' + icon('bell', 22) + '</div>' +
      '<h4>Không có thông báo</h4><p>Mọi thứ đang ổn. Hãy tiếp tục ghi chép đều đặn nhé!</p></div>';

  panel.innerHTML =
    '<div class="notif-head"><h4>' + icon('bell', 15) + ' Trung tâm thông báo</h4>' +
      '<span class="chip">' + all.length + '</span></div>' +
    '<div class="notif-list">' + items + '</div>' +
    '<div class="notif-foot">' +
      '<button class="btn btn-ghost btn-xs" data-action="notif-mark-all">Đánh dấu đã đọc</button>' +
      '<button class="btn btn-ghost btn-xs" data-action="notif-clear">Đặt lại</button>' +
    '</div>';
  document.body.appendChild(panel);

  /* Đánh dấu đã đọc khi mở panel */
  const ids = all.map(function(n){ return n.id; });
  let changed = false;
  ids.forEach(function(i){ if(S.readNotifs.indexOf(i) === -1){ S.readNotifs.push(i); changed = true; } });
  if(changed){ save(); }
  updateNotifBadge();
}

/* Đóng panel khi click ra ngoài */
document.addEventListener('mousedown', function(e){
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  if(panel.contains(e.target)) return;
  if(e.target.closest('[data-action="toggle-notif"]')) return;
  panel.remove();
});

/* ============================================================
   L. KHỞI TẠO
   ============================================================ */
function init(){
  /* Tải Google Fonts thất bại → vẫn dùng font hệ thống (đã khai báo fallback) */
  document.body.classList.toggle('dark', S.settings.theme === 'dark');

  /* Nếu Chart.js không tải được, hệ thống tự dùng bộ vẽ Canvas dự phòng */
  if(typeof window.Chart !== 'function'){
    console.warn('Chart.js không khả dụng — đang dùng bộ vẽ biểu đồ dự phòng.');
  }

  /* Đảm bảo tháng mặc định nằm trong kỳ quản lý */
  const thisMonth = monthOf(todayISO());
  if(CAL_MONTHS.indexOf(UI.dashMonth) === -1){
    UI.dashMonth = CAL_MONTHS.indexOf(thisMonth) >= 0 ? thisMonth : CAL_MONTHS[0];
  }
  if(CAL_MONTHS.indexOf(UI.calMonth) === -1) UI.calMonth = CAL_MONTHS[0];

  /* Sinh ID đã đọc gọn gàng */
  if(!Array.isArray(S.readNotifs)) S.readNotifs = [];

  render();

  /* Lưu lại ngân sách mặc định cho tháng hiện tại nếu chưa có */
  if(S.settings.defaultBudget && (S.settings.defaultBudget.monthly || S.settings.defaultBudget.daily)){
    const mk = CAL_MONTHS.indexOf(thisMonth) >= 0 ? thisMonth : CAL_MONTHS[0];
    if(!S.budgets[mk]){
      S.budgets[mk] = {
        monthly: Number(S.settings.defaultBudget.monthly) || 0,
        weekly: 0,
        daily: Number(S.settings.defaultBudget.daily) || 0,
        categories: {}
      };
      save(true);
    }
  }
}

document.addEventListener('DOMContentLoaded', init);
if(document.readyState !== 'loading'){ init(); }
</script>
